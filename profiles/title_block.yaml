# Title-block profile for the A3 template generated by templates/A3_SheetFormat.bas.
#
# Two ways to fill a title block:
#
#   custom_properties  (recommended) - the sheet format links its fields to document custom
#                      properties ($PRP:"PartNo" ...). swdraw writes the properties; SolidWorks
#                      updates the text. Robust to layout changes and to SetText losing formatting.
#
#   placeholder_notes  - the sheet carries plain notes ("PART-NO", "NAME", "DD/MM/YYYY" ...).
#                      swdraw finds each note by its position (and optionally its text) and
#                      replaces it. Positions are sheet millimetres from the BOTTOM-LEFT corner,
#                      measured at the note's anchor (Annotation.GetPosition).
#
mode: custom_properties

custom_properties:
  fields:
    part_no: PartNo
    description: Description
    material: Material
    finish: Finish
    project: Project
    parent: ParentAssy
    status: Status
    revision: Revision
    drawn_by: DrawnBy
    drawn_date: DrawnDate
    approved_by: ApprovedBy
    approved_date: ApprovedDate
  # Fields the sheet format reads from the PART ($PRPSHEET:"..."), not the drawing ($PRP:"...").
  # swdraw writes these to the model shown in the first view (modified, not saved).
  model_fields: [part_no, description, material, finish, project, parent]
  # One entry per revision-table row, oldest first.
  rev_rows:
    - {rev: Rev1, desc: Rev1Desc, date: Rev1Date, drawn: Rev1By, approved: Rev1App}
    - {rev: Rev2, desc: Rev2Desc, date: Rev2Date, drawn: Rev2By, approved: Rev2App}

placeholder_notes:
  tolerance_mm: 2.5            # default match radius around `at`
  fields:
    part_no:       {at: [301.2, 15.6], placeholder: "PART-NO"}
    description:   {at: [301.2, 29.6], placeholder: "PART DESCRIPTION"}
    material:      {at: [231.2, 29.8], placeholder: "MATERIAL SPECIFICATION"}
    finish:        {at: [231.2, 21.6], placeholder: "FINISH / TREATMENT"}   # the label above has the same text
    project:       {at: [231.2, 13.8], placeholder: "PROJECT"}
    parent:        {at: [259.2, 13.8], placeholder: "ASSEMBLY NO."}
    status:        {at: [332.0, 57.7], placeholder: "DRAFT"}
    drawn_by:      {at: [231.2, 45.8], placeholder: "NAME"}
    drawn_date:    {at: [279.2, 45.5], placeholder: "DD/MM/YYYY"}
    approved_by:   {at: [231.2, 37.8], placeholder: "NAME"}
    approved_date: {at: [279.2, 37.5], placeholder: "DD/MM/YYYY"}
  # The REV box in the bottom-right cell: any note right of min_x and below max_y.
  rev_box: {min_x: 330, max_y: 22, height_mm: 3.5}
  # Revision table: one row per revision, oldest first (row 1 = first issue).
  rev_table:
    rows_y: [73.4, 78.4]
    columns: {rev: 233.5, desc: 242.0, date: 353.5, drawn: 376.5, approved: 393.5}
    tolerance_mm: 2.5
    desc_tolerance_mm: 4.0
    text_height_mm: 2.5
    # Placeholder text each cell starts with (blank cells are also accepted).
    placeholders: {rev: ["A", "B"], desc: ["FIRST ISSUE", "REVISION DESCRIPTION"], date: ["DD/MM/YYYY"],
                   drawn: ["XX"], approved: ["XX"]}
  # Notes that point at the finish note ("... SEE NOTE 4") are renumbered by `finish_note`.
  see_note_marker: "SEE NOTE"
