name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra mcp --extra preview --extra dev
      - name: Tests (fake SolidWorks API)
        run: uv run python -m pytest -q
      - name: capabilities.yaml matches the server
        run: uv run python scripts/generate_capabilities.py --check

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate extension manifest
        run: npx -y @anthropic-ai/mcpb validate manifest.json
